name: Test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

# The job itself is core's, because an extension's CI is core's CI plus the
# extension: check out both, point core's bundle at this checkout, build core's
# assets, then run this engine's linting and specs. See doc/extensions.md there.
#
# A reusable workflow is resolved at the ref the caller names, so the `uses` ref
# and placecal_ref name the same branch.
jobs:
  test:
    uses: geeksforsocialchange/PlaceCal/.github/workflows/extension-test.yml@main
    with:
      engine: placecal-theme-mossley
      module_dir: mossley
      chrome: true
      placecal_ref: main
