# The rules for a PlaceCal extension live in core, so both theme engines read
# one file instead of each carrying a copy that drifts. Core is always beside
# this checkout: the reusable workflow checks it out at ./PlaceCal, and locally
# RuboCop already runs with BUNDLE_GEMFILE pointed at a core checkout.
inherit_from: ../PlaceCal/config/rubocop/extension.yml
